<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0">

          </h1>
          <p class="lead text-muted mb-4">
            Bienvenido al proyecto Angular.
          </p>
          
          <div class="row mt-5">
            <div class="col-md-6 mb-3">
              <div class="card h-100 border-primary">
                <div class="card-body">
                  <i class="bi bi-database-add display-6 text-primary mb-3"></i>
                  <h5 class="card-title">Insertar Datos</h5>
                  <p class="card-text"></p>
                  <a routerLink="/insert-data" class="btn btn-primary">
                    Probar <i class="bi bi-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
            
            <div class="col-md-6 mb-3">
              <div class="card h-100 border-success">
                <div class="card-body">
                  <i class="bi bi-person-plus display-6 text-success mb-3"></i>

                  <a routerLink="/register" class="btn btn-success">

              </div>

                <div class="card-body">
                  <i class="bi bi-images display-6 text-info mb-3"></i>

                  <p class="card-text"></p>
                  <a routerLink="/upload" class="btn btn-info text-white">

                  </a>
                </div>
              </div>
            </div>
            
            <div class="col-md-6 mb-3">
              <div class="card h-100 border-warning">

                  <i class="bi bi-exclamation-triangle display-6 text-warning mb-3"></i>
                  <h5 class="card-title">Página de Error</h5>

                  <a routerLink="/error" class="btn btn-warning">
                    Probar <i class="bi bi-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
